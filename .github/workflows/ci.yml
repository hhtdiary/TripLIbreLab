name: CI

# Same shape as TripLibre's CI, minus the Swift jobs (lint, build, tests) and the SwiftUI accessibility
# workflow: there is no Swift code in this repository yet. Those jobs come back with the iOS app.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (docs JS/CSS/HTML + a11y rules, Markdown, Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint, Stylelint, html-validate (incl. a11y rules), markdownlint
        run: npm run lint
      - name: Ruff (tools/)
        run: pipx run ruff==0.15.1 check

  a11y:
    name: Docs accessibility (axe-core, WCAG 2.1 AA, light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: axe-core on every docs page
        run: npm run a11y

  contract:
    name: Data contract (fixtures + inspector tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Committed fixtures match the generator
        run: make fixtures-check
      - name: Contract tests
        run: make test
      - name: Inspector verdict on every fixture
        run: make contract-check
