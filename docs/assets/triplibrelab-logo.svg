<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="TripLibreLab">
  <!-- TripLibreLab's mark in its own colours (indigo, cyan, violet): a recorded route under a lab grid, with a play
       head on it because TripLibreLab replays the day TripLibre recorded. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f8f"/>
      <stop offset="1" stop-color="#0b0d33"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd8eb"/>
      <stop offset="1" stop-color="#b08cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#96beff" stroke-opacity=".14" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect width="256" height="256" rx="56" fill="url(#grid)"/>
  <path d="M52 172c0-52 44-30 76-62s76-12 76 34" fill="none" stroke="url(#route)" stroke-width="16" stroke-linecap="round"/>
  <path d="M52 172c0-52 44-30 76-62s76-12 76 34" fill="none" stroke="#eef3ff" stroke-width="2.5" stroke-dasharray="6 9" stroke-linecap="round"/>
  <circle cx="52" cy="176" r="15" fill="#0b0d33"/>
  <circle cx="52" cy="176" r="8" fill="#4fd8eb"/>
  <circle cx="204" cy="150" r="30" fill="#b08cff"/>
  <path d="M195 136v28l23-14z" fill="#0b0d33"/>
</svg>
